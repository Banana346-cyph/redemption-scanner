name: Update cards and publish

on:
  schedule:
    - cron: "17 9 * * *"   # every night, about 4:17 AM Central
  workflow_dispatch: {}     # "Run workflow" button
  push:
    branches: [main]        # publish whenever files are uploaded

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Keep our own copy of the QR code helpers
        run: |
          [ -s qrcode.min.js ] || curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js -o qrcode.min.js
          [ -s jsQR.min.js ] || curl -fsSL https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js -o jsQR.min.js
      - run: python scripts/update_cards.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update cards and prices" && git push)

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
